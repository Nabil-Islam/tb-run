name: tbprofiler_v7
channels:
  - conda-forge
  - bioconda
# TB-Profiler 7.0.0 is not on bioconda yet (recipe merged 19 Nov 2026, build not
# published). Its dependencies are, so they come from conda here, and
# tbprofiler_v7.post-deploy.sh installs TB-Profiler 7.0.0 itself from the GitHub
# release, the same way the bioconda recipe's build.sh does.
# Once `conda search -c bioconda tb-profiler=7.0.0` finds it, replace this file's
# dependencies with `tb-profiler=7.0.0` + fastq-dl and delete the post-deploy script.
dependencies:
  - python=3.10         # pathogen-profiler 5.5.0 on bioconda pins python 3.10
  - pip
  - setuptools
  - git
  - bwa
  - samtools
  - pathogen-profiler=5.5.0
  - is6110=0.5.2
  - jinja2
  - filelock
  - docxtpl
  - joblib
  - tqdm
  - pysam
  - rich-argparse
  - pyyaml
  - packaging          # imported by tbprofiler 7 but missing from its recipe
  - fastq-dl>=3         # paired runs: downloads only _1/_2, skips orphan reads
